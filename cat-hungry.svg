<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Cat ears - rounded -->
  <path d="M14 30C14 30 12 14 20 10C28 6 28 24 28 24" fill="#f97316" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M50 30C50 30 52 14 44 10C36 6 36 24 36 24" fill="#f97316" stroke="#ea580c" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Inner ears - rounded -->
  <path d="M16 29C16 29 15 18 21 14C27 10 27 24 27 24" fill="#fed7aa"/>
  <path d="M48 29C48 29 49 18 43 14C37 10 37 24 37 24" fill="#fed7aa"/>
  <!-- Head -->
  <circle cx="32" cy="36" r="20" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
  <!-- Cheeks -->
  <circle cx="18" cy="40" r="4" fill="#fed7aa" opacity="0.6"/>
  <circle cx="46" cy="40" r="4" fill="#fed7aa" opacity="0.6"/>
  <!-- Eyes -->
  <circle cx="24" cy="33" r="4" fill="#1c1917"/>
  <circle cx="40" cy="33" r="4" fill="#1c1917"/>
  <!-- Eye shine -->
  <circle cx="26" cy="31" r="1.5" fill="white"/>
  <circle cx="42" cy="31" r="1.5" fill="white"/>
  <circle cx="23" cy="34" r="0.8" fill="white"/>
  <circle cx="39" cy="34" r="0.8" fill="white"/>
  <!-- Nose -->
  <ellipse cx="32" cy="39" rx="2" ry="1.5" fill="#ea580c"/>
  <!-- Anime cat mouth - w shape -->
  <path d="M27 41Q29 44 32 42Q35 44 37 41" stroke="#1c1917" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Little fangs -->
  <path d="M29.5 42L30.5 42L30 43Z" fill="white"/>
  <path d="M33.5 42L34.5 42L34 43Z" fill="white"/>
  <!-- Whiskers - left side -->
  <line x1="18" y1="37" x2="6" y2="34" stroke="#c2410c" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="18" y1="40" x2="5" y2="40" stroke="#c2410c" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="18" y1="43" x2="6" y2="46" stroke="#c2410c" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Whiskers - right side -->
  <line x1="46" y1="37" x2="58" y2="34" stroke="#c2410c" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="46" y1="40" x2="59" y2="40" stroke="#c2410c" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="46" y1="43" x2="58" y2="46" stroke="#c2410c" stroke-width="0.8" stroke-linecap="round"/>
  <!-- Drool -->
  <ellipse cx="35" cy="44" rx="1.2" ry="1.5" fill="#38bdf8"/>
</svg>
