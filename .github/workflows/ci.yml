name: CI

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [master, feat-frontend-add/delete/fix-ingredient-management]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci.yml"

# Cancel outdated runs on same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint / typecheck / build / test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lethimcook
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lethimcook?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-long-for-test
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-long-for-test
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: lethimcook
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          # pnpm 11 (packageManager) requires Node >= 22.13
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MinIO and MailHog for integration tests
        run: |
          docker run -d --name ci-minio -p 9000:9000 --tmpfs /data:rw,mode=1777 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:f74600a1a46330cdbda1ef760d17a96bd6e0f4a6f0a2c49792ca3ee7e4c6fa18 server /data
          docker run -d --name ci-mailhog -p 1025:1025 -p 8025:8025 mailhog/mailhog
          for url in http://localhost:9000/minio/health/live http://localhost:8025/api/v2/messages; do
            ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent "$url" > /dev/null; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              docker logs ci-minio
              docker logs ci-mailhog
              exit 1
            fi
          done

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck (no emit)
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Test with coverage (minimum 80% lines)
        run: pnpm test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

      # Optional project rule check - informational only for now
      - name: Dependency-cruiser
        run: pnpm deps:check
        continue-on-error: true

  frontend:
    name: frontend (lint / typecheck / build / test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          # pnpm 11 (packageManager) requires Node >= 22.13
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (no emit)
        run: pnpm exec tsc -b --noEmit

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test --maxWorkers=2
